name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Gate expression: label-gated jobs run when the label is present OR
# when targeting main (release PR). On push to main (post-merge), they
# also run. On label events, only gated jobs re-trigger.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled'
    strategy:
      matrix:
        features:
          - ""
          - "--features metal"
          - "--features vulkan"
          - "--features verify"
          - "--features verify,vulkan"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Run tests ${{ matrix.features }}
        run: cargo test ${{ matrix.features }}

  test-macos:
    name: Test (macOS Apple Silicon, self-hosted)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    # Public repo + self-hosted runner: same-repo heads only (agent
    # branches), never fork PRs. See Holmberg docs/ci-runners.md.
    if: |
      github.event.action != 'labeled' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Run tests (metal)
        run: cargo test --features metal

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build docs (all features)
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  kani:
    name: Kani Verification
    runs-on: [self-hosted, kani]
    timeout-minutes: 15
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request' && (
        github.base_ref == 'main' ||
        contains(github.event.pull_request.labels.*.name, 'run-kani')
      )
    steps:
      - uses: actions/checkout@v4
      - name: Run Kani harnesses
        run: |
          cargo kani --harness buffer_alignment_boundary
          cargo kani --harness workgroup_divisibility
          cargo kani --harness buffer_size_no_overflow

  miri:
    name: Miri (safety check)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request' && (
        github.base_ref == 'main' ||
        contains(github.event.pull_request.labels.*.name, 'run-miri')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Run Miri on epoch counter safety
        run: cargo miri test epoch

  gpu:
    name: GPU dispatch tests (self-hosted)
    runs-on: [self-hosted, gpu]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request' && (
        github.base_ref == 'main' ||
        contains(github.event.pull_request.labels.*.name, 'run-gpu')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Run GPU dispatch tests (Vulkan)
        run: cargo test --features vulkan -- --ignored
      - name: Run numerical verification (Vulkan)
        run: cargo run --features vulkan,verify --example numerical_verification || true
      - name: Run determinism check (Vulkan)
        run: cargo run --features vulkan,verify --example determinism_check || true
